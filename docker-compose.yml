services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.9
    container_name: etcd-ha
    environment:
      - ETCD_ALLOW_NONE_AUTHENTICATION=yes
    command: >
      /usr/local/bin/etcd
      --name etcd0
      --listen-client-urls http://0.0.0.0:2379
      --advertise-client-urls http://0.0.0.0:2379
    ports:
      - "2379:2379"
