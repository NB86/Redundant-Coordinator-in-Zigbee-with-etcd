
services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.9
    container_name: etcd-ha
    environment:
      - ETCD_ALLOW_NONE_AUTHENTICATION=yes
    command: >
      /usr/local/bin/etcd 
      --name etcd0
      --listen-client-urls http://0.0.0.0:2379 
      --advertise-client-urls http://0.0.0.0:2379
    ports:
      - "2379:2379"

  mosquitto:
    image: eclipse-mosquitto:2.0.18
    container_name: mosquitto-ha
    ports:
      - "1883:1883"
    command: sh -c "echo 'listener 1883' > /mosquitto/config/mosquitto.conf && echo 'allow_anonymous true' >> /mosquitto/config/mosquitto.conf && /usr/sbin/mosquitto -c /mosquitto/config/mosquitto.conf"

  homeassistant:
    image: "ghcr.io/home-assistant/home-assistant:stable"
    container_name: homeassistant
    ports:
      - "8123:8123"
    volumes:
      - ./ha_config:/config
